name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly: download the latest buoy observations and rebuild the page.
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Downloads the latest NDBC observations and runs the committed models on them.
      # If NDBC cannot be reached it falls back to the committed sample and says so on the page.
      # Nothing fetched here is committed.
      - run: uv run buoycast-site --live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
