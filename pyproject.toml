[project]
name = "buoycast"
version = "0.1.0"
description = "Short-term wave height forecasts from NOAA buoy data, with baselines, a PyTorch model and a small API"
readme = "README.md"
authors = [
    { name = "Andy He", email = "andy-he@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "shapely>=2.2.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
buoycast-download = "buoycast.download:main"
buoycast-train = "buoycast.train:main"
buoycast-serve = "buoycast.api:serve"
buoycast-nnja = "buoycast.nnja:main"
buoycast-drifters = "buoycast.drifters:main"
buoycast-qc = "buoycast.qc_run:main"
buoycast-verify = "buoycast.verify:main"
buoycast-extra = "buoycast.extra_run:main"
buoycast-export = "buoycast.geo:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "geopandas>=1.2.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/buoycast/paths.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
